<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj wydarzenie</title>
    <link rel="stylesheet" href="styles.css?v=2.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-container h2 {
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group textarea {
            resize: vertical;
            height: 100px;
        }
        .form-group .checkbox-group {
            display: flex;
            align-items: center;
        }
        .form-group .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .form-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .form-actions button[type="submit"] {
            background-color: #0078d7;
            color: white;
        }
        .form-actions button[type="button"] {
            background-color: #f0f0f0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Dodaj nowe wydarzenie</h2>
        <form id="event-form">
            <!-- Typ wydarzenia -->
            <div class="form-group">
                <label for="event-type">Typ wydarzenia:</label>
                <select id="event-type" name="event-type" required onchange="handleEventTypeChange()">
                    <option value="mecz-dom">Mecz - dom</option>
                    <option value="mecz-wyjazd">Mecz - wyjazd</option>
                    <option value="trening">Trening</option>
                    <option value="oboz">Obóz</option>
                    <option value="fizjo">Fizjoterapeuta</option>
                </select>
            </div>

            <!-- Nazwa wydarzenia -->
            <div class="form-group">
                <label for="event-name">Nazwa wydarzenia:</label>
                <input type="text" id="event-name" name="event-name" required maxlength="100">
            </div>

            <!-- Data -->
            <div class="form-group">
                <label for="event-date">Data:</label>
                <input type="date" id="event-date" name="event-date" required onchange="setDefaultTime()">
            </div>

            <!-- Godzina -->
            <div class="form-group">
                <label for="event-time">Godzina:</label>
                <input type="time" id="event-time" name="event-time" step="900" required value="17:00">
            </div>

            <!-- Lokalizacja -->
            <div class="form-group">
                <label for="event-location">Lokalizacja:</label>
                <select id="event-location" name="event-location">
                    <option value="Sierakowice, Kubusia Puchatka 7 - SP1">Sierakowice, Kubusia Puchatka 7 - SP1</option>
                    <option value="Sierakowice, Spacerowa 14 - SP2">Sierakowice, Spacerowa 14 - SP2</option>
                    <option value="Sierakowice, Dworcowa 3 - LO1">Sierakowice, Dworcowa 3 - LO1</option>
                    <option value="Mecz wyjazdowy">Mecz wyjazdowy</option>
                </select>
            </div>

            <!-- Powtarzanie cykliczne -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="event-repeat" name="event-repeat">
                    <label for="event-repeat">Powtarzaj co tydzień</label>
                </div>
            </div>

            <!-- Notatki -->
            <div class="form-group">
                <label for="event-notes">Notatki:</label>
                <textarea id="event-notes" name="event-notes" maxlength="1000"></textarea>
            </div>

            <!-- Przyciski akcji -->
            <div class="form-actions">
                <button type="button" onclick="window.history.back()">Anuluj</button>
                <button type="submit">Zapisz</button>
            </div>
        </form>
    </div>

    <!-- Skrypty JavaScript -->
    <script src="config.js"></script>
    <script src="storage.js"></script>
    
    <script>
        // Czekaj na załadowanie storage
        document.addEventListener('DOMContentLoaded', function() {
            // Sprawdź czy storage jest dostępne
            if (typeof window.storage === 'undefined') {
                console.error('❌ Storage nie jest dostępne!');
                return;
            }
            
            console.log('✅ Storage załadowane:', window.storage);
        });

        // Automatyczne przypisanie koloru na podstawie typu wydarzenia
        const eventColors = {
            'mecz-dom': '#0078d7',
            'mecz-wyjazd': '#dc3545',
            'trening': '#28a745',
            'oboz': '#17a2b8',
            'fizjo': '#ffc107'
        };

        // Wczytaj edytowane wydarzenie (jeśli istnieje)
        const editEventId = localStorage.getItem('editEventId');
        let editEvent = null;

        if (editEventId) {
            const savedEvents = JSON.parse(localStorage.getItem('savedEvents')) || [];
            editEvent = savedEvents.find(event => event.id === parseInt(editEventId));
        }

        // Wypełnij formularz danymi edytowanego wydarzenia
        if (editEvent) {
            document.getElementById('event-name').value = editEvent.name;
            document.getElementById('event-date').value = editEvent.date.split('T')[0];
            document.getElementById('event-time').value = editEvent.date.split('T')[1].substring(0, 5);
            document.getElementById('event-location').value = editEvent.location;
            document.getElementById('event-repeat').checked = editEvent.repeat;
            document.getElementById('event-notes').value = editEvent.notes;
            document.getElementById('event-type').value = editEvent.type;
        }

        // Ustaw domyślną datę na dzisiaj
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('event-date').value = today;

        // Funkcja do ustawienia domyślnej godziny na 17:00
        function setDefaultTime() {
            const eventTime = document.getElementById('event-time');
            if (!eventTime.value) {
                eventTime.value = '17:00';
            }
        }

        // Funkcja do generowania unikalnego ID
        function generateUniqueId() {
            return Date.now() + Math.floor(Math.random() * 1000);
        }

        // Obsługa formularza
        document.getElementById('event-form').addEventListener('submit', function (e) {
            e.preventDefault();

            // Pobierz wartości z formularza
            const eventName = document.getElementById('event-name').value.trim();
            const eventDate = document.getElementById('event-date').value;
            const eventTime = document.getElementById('event-time').value;
            const eventLocation = document.getElementById('event-location').value;
            const eventRepeat = document.getElementById('event-repeat').checked;
            const eventNotes = document.getElementById('event-notes').value.trim();
            const eventType = document.getElementById('event-type').value;

            // Walidacja danych
            if (!eventName) {
                alert("Proszę podać nazwę wydarzenia.");
                return;
            }
            if (!eventDate) {
                alert("Proszę wybrać datę wydarzenia.");
                return;
            }
            if (!eventTime) {
                alert("Proszę wybrać godzinę wydarzenia.");
                return;
            }
            if (!eventLocation) {
                alert("Proszę wybrać lokalizację wydarzenia.");
                return;
            }
            
            // Walidacja daty - sprawdź czy data jest poprawna
            const eventDateTime = new Date(eventDate + 'T' + eventTime);
            if (isNaN(eventDateTime.getTime())) {
                alert("Niepoprawna data lub godzina wydarzenia.");
                return;
            }
            
            // Walidacja długości nazwy
            if (eventName.length > 100) {
                alert("Nazwa wydarzenia nie może być dłuższa niż 100 znaków.");
                return;
            }
            
            // Walidacja długości notatek
            if (eventNotes.length > 1000) {
                alert("Notatki nie mogą być dłuższe niż 1000 znaków.");
                return;
            }

            // Utwórz obiekt wydarzenia
            const event = {
                id: editEvent ? editEvent.id : generateUniqueId(),
                name: eventName,
                date: eventDate + 'T' + eventTime,
                location: eventLocation,
                repeat: eventRepeat,
                notes: eventNotes,
                type: eventType,
                color: eventColors[eventType]
            };

            // Zapisz wydarzenie używając storage.js
            if (editEvent) {
                // Edytuj istniejące wydarzenie
                window.storage.saveEvent(event);
                console.log(`Zaktualizowano wydarzenie: ${event.name} na dzień ${eventDate}`);
            } else {
                // Dodaj nowe wydarzenie
                window.storage.saveEvent(event);
                console.log(`Dodano wydarzenie: ${event.name} na dzień ${eventDate}`);

                // Jeśli opcja "Powtarzaj co tydzień" jest zaznaczona, dodaj wydarzenia dla kolejnych tygodni
                if (eventRepeat) {
                    const repeatWeeks = 16;
                    console.log(`Dodawanie powtarzających się wydarzeń co tydzień przez ${repeatWeeks} tygodni:`);
                    
                    for (let i = 1; i <= repeatWeeks; i++) {
                        const newEventDate = new Date(event.date);
                        newEventDate.setDate(newEventDate.getDate() + 7 * i);

                        const repeatedEvent = {
                            ...event,
                            id: generateUniqueId(),
                            date: newEventDate.toISOString().split('T')[0] + 'T' + eventTime
                        };

                        window.storage.saveEvent(repeatedEvent);
                        console.log(`Dodano powtórzenie ${i}: ${repeatedEvent.name} na dzień ${repeatedEvent.date.split('T')[0]}`);
                    }
                    
                    console.log(`Łącznie dodano ${repeatWeeks + 1} wydarzeń (oryginalne + ${repeatWeeks} powtórzeń)`);
                }
            }

            // Wyczyść edytowane wydarzenie
            localStorage.removeItem('editEventId');

            // Przekieruj z powrotem do kalendarza
            window.location.href = 'main.html';
        });

        // Funkcja do obsługi zmiany typu wydarzenia
        function handleEventTypeChange() {
            const eventType = document.getElementById('event-type').value;
            const eventNameInput = document.getElementById('event-name');

            // Ustaw domyślną nazwę na podstawie typu
            if (eventType === 'mecz-dom') {
                eventNameInput.value = 'Mecz domowy';
            } else if (eventType === 'mecz-wyjazd') {
                eventNameInput.value = 'Mecz wyjazdowy';
            } else if (eventType === 'trening') {
                eventNameInput.value = 'Trening';
            } else if (eventType === 'oboz') {
                eventNameInput.value = 'Obóz';
            } else if (eventType === 'fizjo') {
                eventNameInput.value = 'Fizjoterapeuta';
            }
        }

        // Inicjalizacja formularza
        handleEventTypeChange();
        setDefaultTime();
    </script>
</body>
</html>
