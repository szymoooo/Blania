<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self';">
    <title>Dodaj wydarzenie</title>
    <link rel="stylesheet" href="styles.css?v=2.0">
</head>
<body>
    <div class="form-container">
        <h2>Dodaj nowe wydarzenie</h2>
        <form id="event-form" onsubmit="return false;">
            <!-- Typ wydarzenia -->
            <div class="form-group">
                <label for="event-type">Typ wydarzenia:</label>
                <select id="event-type" name="event-type" required onchange="handleEventTypeChange()">
                    <option value="mecz-ligowy">Mecz ligowy</option>
                    <option value="trening">Trening</option>
                    <option value="fizjoterapeuta">Fizjoterapeuta</option>
                    <option value="mecz-sparingowy">Mecz sparingowy</option>
                    <option value="turniej">Turniej</option>
                    <option value="oboz">Obóz</option>
                    <option value="bus">Bus</option>
                </select>
            </div>

            <!-- Nazwa wydarzenia -->
            <div class="form-group">
                <label for="event-name">Nazwa wydarzenia:</label>
                <select id="event-name" name="event-name" required>
                    <option value="">Wybierz drużynę</option>
                </select>
            </div>

            <!-- Data -->
            <div class="form-group">
                <label for="event-date">Data:</label>
                <input type="date" id="event-date" name="event-date" required>
            </div>

            <!-- Godzina -->
            <div class="form-group">
                <label for="event-time">Godzina:</label>
                <input type="time" id="event-time" name="event-time" value="10:30">
            </div>

            <!-- Lokalizacja -->
            <div class="form-group">
                <label for="event-location">Lokalizacja:</label>
                <select id="event-location" name="event-location">
                    <option value="Gdynia, ul. Cechowa 22 - SP6">Gdynia, ul. Cechowa 22 - SP6</option>
                    <option value="Gdynia, ul. Wiczlińska 50a - Microsoft">Gdynia, ul. Wiczlińska 50a - Microsoft</option>
                    <option value="Gdynia, ul. Kopernika 34 - Maku">Gdynia, ul. Kopernika 34 - Maku</option>
                    <option value="Gdynia, ul. Olimpijska 5/9 - GCS">Gdynia, ul. Olimpijska 5/9 - GCS</option>
                    <option value="Sopot, ul. Książąt Pomorskich 16-18">Sopot, ul. Książąt Pomorskich 16-18</option>
                    <option value="Mecz wyjazdowy">Mecz wyjazdowy</option>
                    <option value="Dom">Dom</option>
                </select>
            </div>

            <!-- Powtarzanie -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="event-repeat" name="event-repeat">
                    <label for="event-repeat">Powtarzaj co tydzień</label>
                </div>
            </div>

            <!-- Notatki -->
            <div class="form-group">
                <label for="event-notes">Notatki:</label>
                <textarea id="event-notes" name="event-notes"></textarea>
            </div>

            <!-- Przypomnienie -->
            <div class="form-group">
                <label for="reminder">Przypomnienie:</label>
                <select id="reminder" name="reminder">
                    <option value="0">Brak przypomnienia</option>
                    <option value="5">5 minut przed</option>
                    <option value="15">15 minut przed</option>
                    <option value="30">30 minut przed</option>
                    <option value="60">1 godzina przed</option>
                    <option value="1440">1 dzień przed</option>
                </select>
            </div>

            <!-- Przyciski -->
            <div class="form-actions">
                <button type="button" onclick="cancelEvent()">Anuluj</button>
                <button type="button" onclick="saveEvent()">Zapisz</button>
            </div>
        </form>
    </div>

    <!-- Skrypty JavaScript - na końcu strony -->
    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="eventHandlers.js"></script>
    <script>
        // Wczytaj edytowane wydarzenie (jeśli istnieje)
        const editEventId = storage.getEditEventId();
        let editEvent = null;

        if (editEventId) {
            const savedEvents = storage.getSavedEvents();
            editEvent = savedEvents.find(event => event.id === parseInt(editEventId));
        }

        // Wypełnij formularz danymi edytowanego wydarzenia
        if (editEvent) {
            document.getElementById('event-name').value = editEvent.name;
            document.getElementById('event-date').value = editEvent.date.split('T')[0];
            document.getElementById('event-time').value = editEvent.date.split('T')[1].substring(0, 5);
            document.getElementById('event-location').value = editEvent.location;
            document.getElementById('event-repeat').checked = editEvent.repeat;
            document.getElementById('event-notes').value = editEvent.notes;
            document.getElementById('reminder').value = editEvent.reminder;
            document.getElementById('event-type').value = editEvent.type;
        }

        // Ustaw domyślną datę z localStorage (jeśli istnieje)
        const selectedDate = storage.getSelectedDate();
        if (selectedDate) {
            document.getElementById('event-date').value = selectedDate;
        }

        // Funkcja obsługi zmiany typu wydarzenia
        function handleEventTypeChange() {
            const eventType = document.getElementById('event-type').value;
            const eventNameSelect = document.getElementById('event-name');
            
            // Wyczyść poprzednie opcje
            eventNameSelect.innerHTML = '';
            
            if (eventType === 'mecz-ligowy' || eventType === 'mecz-sparingowy') {
                // Opcje drużyn dla meczów
                const teams = ['BAT Sierakowice', 'BAT Kartuzy', 'Bryza Pruszcz Gd', 'Elbląg', 'Pruszcz Gdański 1', 'Pruszcz Gdański 2', 'BK VLCI Žďár', 'BKM Žilina', 'MOSiR Bochnia', 'UKS ŻAK Nowy Sącz', 'Young Angels Košice'];
                teams.forEach(team => {
                    const option = document.createElement('option');
                    option.value = team;
                    option.textContent = team;
                    eventNameSelect.appendChild(option);
                });
            } else {
                // Opcje dla innych typów wydarzeń
                const options = ['Trening', 'Fizjoterapeuta', 'Turniej', 'Obóz', 'Bus'];
                options.forEach(option => {
                    const optionElement = document.createElement('option');
                    optionElement.value = option;
                    optionElement.textContent = option;
                    eventNameSelect.appendChild(optionElement);
                });
            }
        }

        // Funkcja zapisywania wydarzenia
        function saveEvent() {
            console.log('💾 Przycisk "Zapisz wydarzenie" został kliknięty!');
            
            const eventType = document.getElementById('event-type').value;
            const eventName = document.getElementById('event-name').value;
            const eventDate = document.getElementById('event-date').value;
            const eventTime = document.getElementById('event-time').value;
            const eventLocation = document.getElementById('event-location').value;
            const isRecurring = document.getElementById('event-repeat').checked;
            const eventNotes = document.getElementById('event-notes').value;
            const reminder = document.getElementById('reminder').value;
            
            if (!eventName || !eventDate) {
                alert('Proszę wypełnić nazwę wydarzenia i datę.');
                return;
            }
            
            const event = {
                id: Date.now(),
                type: eventType,
                name: eventName,
                date: eventDate,
                time: eventTime,
                location: eventLocation,
                recurring: isRecurring,
                notes: eventNotes,
                reminder: reminder,
                createdAt: new Date().toISOString()
            };
            
            if (storage.saveEvent(event)) {
                console.log('✅ Wydarzenie zapisane pomyślnie');
                window.location.href = 'main.html';
            } else {
                console.error('❌ Błąd podczas zapisywania wydarzenia');
                alert('Błąd podczas zapisywania wydarzenia.');
            }
        }
        
        // Funkcja anulowania
        function cancelEvent() {
            console.log('❌ Przycisk "Anuluj" został kliknięty!');
            window.location.href = 'main.html';
        }
    </script>
</body>
</html>
