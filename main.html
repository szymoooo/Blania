<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://accounts.google.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self';">
    <title>Mecze Blanki</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3.0">
    <style>
        /* Fallback CSS - podstawowe style */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
            color: #333;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .calendar-container {
            width: 1200px;
            margin: 20px auto;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border: 2px solid #0078d7;
            position: relative;
            padding-bottom: 80px;
        }
        
        .team-and-notes-container {
            display: flex;
            gap: 20px;
            width: 1200px;
            margin: 20px auto;
            position: relative;
        }
        
        .team-selection-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            width: 600px;
            height: 320px;
            border: 2px solid #0078d7;
            border-radius: 8px;
            padding: 15px;
            background-color: #f8f9fa;
            position: relative;
        }
        
        .scouting-notes {
            width: 600px;
            height: 330px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 2px solid #0078d7;
            border-radius: 8px;
            padding: 10px;
            background-color: #f8f9fa;
            position: relative;
        }
        
        button, .primary-btn, .btn-prev-calendar, .btn-next-calendar, 
        .btn-add-event, .btn-start-game, .btn-prev-note, .btn-next-note, 
        .btn-add-note, .btn-edit-note, .btn-prev-stats, .btn-next-stats {
            font-size: 16px;
            padding: 10px 18px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .btn-add-event { background-color: #28a745; }
        .btn-start-game { background-color: #dc3545; }
        .btn-edit-note { background-color: #ffc107; color: black; }
        
        button:hover, .primary-btn:hover, .btn-prev-calendar:hover, 
        .btn-next-calendar:hover, .btn-add-event:hover, .btn-start-game:hover, 
        .btn-prev-note:hover, .btn-next-note:hover, .btn-add-note:hover, 
        .btn-edit-note:hover, .btn-prev-stats:hover, .btn-next-stats:hover {
            background-color: #005bb5;
            opacity: 0.9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <h2>Mój planner:</h2>
    </header>
    
    <div class="calendar-container">
        <div class="calendar-week"></div>
        <div class="navigation-buttons">
            <button class="btn-prev-calendar">Poprzednia</button>
            <button class="btn-add-event">+ Dodaj wydarzenie</button>
            <button class="btn-next-calendar">Następna</button>
        </div>
    </div>

    <header>
        <h2>Najbliższy przeciwnik:</h2>
    </header>

    <div class="team-and-notes-container">
        <div class="team-selection-container">
            <div class="team-logo-container">
                <img id="team-logo" src="BAT Sierakowice.png" alt="Logo drużyny" class="team-logo">
            </div>
            <div class="team-info-container">
                <select id="team-selector" class="team-selector">
                    <option value="BAT Sierakowice">BAT Sierakowice</option>
                    <option value="BAT Kartuzy">BAT Kartuzy</option>
                    <option value="Bryza Pruszcz Gd">Bryza Pruszcz Gd</option>
                    <option value="Elbląg">Elbląg</option>
                    <option value="Pruszcz Gdański 1">Pruszcz Gdański 1</option>
                    <option value="Pruszcz Gdański 2">Pruszcz Gdański 2</option>
                    <option value="BK VLCI Žďár">BK VLCI Žďár</option>
                    <option value="BKM Žilina">BKM Žilina</option>
                    <option value="MOSiR Bochnia">MOSiR Bochnia</option>
                    <option value="UKS ŻAK Nowy Sącz">UKS ŻAK Nowy Sącz</option>
                    <option value="Young Angels Košice">Young Angels Košice</option>
                </select>
                <input type="date" id="game-date" class="date-input">
                <button class="btn-start-game">Gramy</button>
            </div>
        </div>

        <div class="scouting-notes">
            <div class="notes-display" id="notes-display">
                <p>Tutaj dodaj swoje spostrzeżenia na temat przeciwnika. Kliknij "Dodaj".</p>
            </div>
            <div class="notes-navigation" id="notes-navigation">
                <button class="btn-prev-note">Poprzednia</button>
                <button class="btn-edit-note">Edytuj</button>
                <button class="btn-add-note">Dodaj</button>
                <button class="btn-next-note">Następna</button>
            </div>
        </div>
    </div>

    <header>
        <h2>Moje statystyki:</h2>
    </header>
    <div class="stats-container">
        <table id="matches-table">
            <thead>
                <tr>
                    <th>Drużyna</th>
                    <th>Data meczu</th>
                    <th>Punkty</th>
                    <th>Asysty</th>
                    <th>Bloki</th>
                    <th>Zbiórki</th>
                    <th>Przechwyty</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="pagination">
            <button id="prev-btn" class="btn-prev-stats" disabled>Poprzednia</button>
            <button id="next-btn" class="btn-next-stats" disabled>Następna</button>
        </div>
    </div>

    <footer>
        <a href="privacy.html" target="_blank">Polityka Prywatności</a> | 
        &copy; 2023 Mecze Blanki. Wszelkie prawa zastrzeżone.
    </footer>

    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="stateManager.js"></script>
    <script src="errorHandler.js"></script>
    <script src="performance.js"></script>
    <script src="eventHandlers.js"></script>
    <script src="app.js"></script>
    <script>
        // Inicjalizuj event handlery po załadowaniu DOM
        document.addEventListener('DOMContentLoaded', () => {
            if (window.eventHandlers) {
                window.eventHandlers.initMainHandlers();
                console.log('✅ Event handlery zainicjalizowane');
            } else {
                console.error('❌ Event handlery nie są dostępne');
            }
        });
    </script>
</body>
</html>
